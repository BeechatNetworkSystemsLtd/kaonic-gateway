[package]
name = "kaonic-vpn"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[features]
run = ["dep:reticulum", "dep:kaonic-reticulum", "dep:tokio-util", "dep:cidr-v3"]
# The container test rig: a VPN node whose Reticulum rides TCP instead of the
# radio. Not built into the gateway.
lab = ["run", "dep:env_logger"]

[[bin]]
name = "kaonic-vpn-lab"
path = "src/bin/kaonic-vpn-lab.rs"
required-features = ["lab"]

[dependencies]
reticulum        = { git = "https://github.com/BeechatNetworkSystemsLtd/Reticulum-rs", rev = "151e3b6c77a8c7d33fafa3971a084ae02510ef39", optional = true }
kaonic-reticulum = { path = "../kaonic-reticulum", optional = true }
cidr-v3          = { package = "cidr", version = "0.3", features = ["serde"], optional = true }
cidr             = { version = "0.2", features = ["serde"] }
radio-common     = { git = "https://github.com/BeechatNetworkSystemsLtd/kaonic-radio" }
tokio-util       = { version = "0.7", optional = true }
etherparse       = "0.19"
if-addrs         = "0.13"
rmp-serde        = "1"
parking_lot      = "0.12"

env_logger = { version = "0.11", optional = true }
log   = "0.4"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }

[target.'cfg(target_os = "linux")'.dependencies]
riptun = { version = "0.1", default-features = false, features = ["tokio-impl"] }
