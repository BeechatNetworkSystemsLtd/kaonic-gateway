[package]
name = "kaonic-plugin-sdk"
version = "0.1.0"
edition = "2021"
description = "Everything a Kaonic plugin needs to talk to its gateway and the mesh"
license = "MIT OR Apache-2.0"

[dependencies]
kaonic-reticulum = { path = "../kaonic-reticulum" }
reticulum        = { git = "https://github.com/BeechatNetworkSystemsLtd/Reticulum-rs", rev = "151e3b6c77a8c7d33fafa3971a084ae02510ef39" }
reqwest          = { version = "0.12", features = ["json"], default-features = false }
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
tokio            = { version = "1", features = ["full"] }
tokio-util       = "0.7"
log              = "0.4"
